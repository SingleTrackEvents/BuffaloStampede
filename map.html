<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SingleTrack map</title>
<meta name="description" content="SingleTrack race-day map: the whole course, aid stations, access points and every tracked runner.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#223c2c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12231a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="lib/fonts.css?v=20">
<link rel="stylesheet" href="lib/leaflet.css?v=20">
<link rel="stylesheet" href="css/app.css?v=20">
</head>
<body class="mappage">
<header class="top">
  <a class="brand" href="./" aria-label="SingleTrack"><img class="brand-logo" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" width="77" height="34"><span class="brand-app">Safety map</span></a>
  <span id="mpStatus" class="mp-status" role="status"></span>
  <nav class="mp-nav">
    <button id="mpRunners" class="mp-btn" type="button" aria-expanded="false">Runners</button>
    <a id="mpFind" class="mp-btn" href="./">Find</a>
  </nav>
  <span id="net" class="net" hidden>Offline</span>
</header>

<main class="mp-main">
  <div class="mp-mapbox"><div id="map" aria-label="Course map"></div></div>
  <aside id="mpPanel" class="mp-panel" hidden aria-label="Runners"></aside>
</main>

<script src="js/live.js?v=20"></script>
<script src="lib/leaflet.js?v=20"></script>
<script src="events/events.js?v=20"></script>
<script src="js/event.js?v=20"></script>
<script>ST.load('config.js')</script>
<script>ST.load('course.js')</script>
<script>ST.load('courses.js')</script>
<script>ST.load('access-edits.js')</script>
<script>ST.load('contingency.js')</script>
<script src="js/engine.js?v=20"></script>
<script>ST.load('tiles.js')</script>
<script src="js/basemap.js?v=20"></script>
<script>ST.load('helipads.js')</script>
<script src="js/helipads.js?v=20"></script>
<script>ST.load('track-grades.js')</script>
<script src="js/track.js?v=20"></script>
<script src="js/contingency.js?v=20"></script>
<script>ST.load('safety-officers.js')</script>
<script>ST.load('pacing.js')</script>
<script>ST.load('demo-runners.js')</script>
<script src="js/demo.js?v=20"></script>
<script src="js/timing.js?v=20"></script>
<script src="js/tracking.js?v=20"></script>
<script src="js/fullscreen.js?v=20"></script>
<script src="js/runners.js?v=20"></script>
<script src="js/intro.js?v=20"></script>
<script src="js/map.js?v=20"></script>
</body>
</html>
